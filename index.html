<body>

<div class="lobby-container" id="lobby-root">
    <div id="lobby" class="lobby-box">
        <div class="tab-group">
            <div id="tab-create" class="tab active" onclick="switchTab('create')">建立遊戲</div>
            <div id="tab-join" class="tab" onclick="switchTab('join')">加入房間</div>
        </div>

        <div id="panel-create">
            <p style="color:#666; font-size:14px;">選擇人數</p>
            <div class="opt-group" id="p-opts">
                <button class="opt-btn" onclick="setVal('p',1)">1 單身貴族</button>
                <button class="opt-btn active" onclick="setVal('p',2)">2 雙排</button>
                <button class="opt-btn" onclick="setVal('p',3)">3 個和尚沒水喝</button>
                <button class="opt-btn" onclick="setVal('p',4)">4 不太吉利</button>
                <button class="opt-btn" onclick="setVal('p',5)">5 友誼破壞機</button>
                <button class="opt-btn" onclick="setVal('p',6)">6 居然湊到六個人？</button>
            </div>
            <p style="color:#666; font-size:14px;">難度等級</p>
            <div class="opt-group" id="d-opts">
                <button class="opt-btn active" onclick="setVal('d',1)">1 簡單</button>
                <button class="opt-btn" onclick="setVal('d',2)">2 自信✨</button>
            </div>
            <button class="btn-main" onclick="socket.emit('createRoom', config)">開始創建</button>
        </div>

        <div id="panel-join" style="display:none;">
            <div class="status-banner" style="margin-bottom:15px; border:1px solid #ddd; min-height:50px; display:flex; align-items:center; justify-content:center;">
                <span id="display-rid" style="letter-spacing: 5px; font-size:24px; color:var(--purple);"></span>
                <span style="width:2px; height:24px; background:var(--purple); animation: blink 1s infinite;" id="cursor"></span>
            </div>
            <div class="keypad">
                <button class="n-btn" onclick="pressLobby(1)">1</button>
                <button class="n-btn" onclick="pressLobby(2)">2</button>
                <button class="n-btn" onclick="pressLobby(3)">3</button>
                <button class="n-btn" onclick="pressLobby(4)">4</button>
                <button class="n-btn" onclick="pressLobby(5)">5</button>
                <button class="n-btn" onclick="pressLobby(6)">6</button>
                <button class="n-btn" onclick="pressLobby(7)">7</button>
                <button class="n-btn" onclick="pressLobby(8)">8</button>
                <button class="n-btn" onclick="pressLobby(9)">9</button>
                <button class="n-btn" style="background:#f5f5f5;" onclick="pressLobby('back')">←</button>
                <button class="n-btn" onclick="pressLobby(0)">0</button>
                <button class="n-btn" style="background:#f5f5f5;" onclick="pressLobby('clear')">C</button>
            </div>
            <button class="btn-main" style="background:var(--blue); box-shadow:0 4px 0 #2980b9;" onclick="doCheck()">查詢房間</button>
            <div id="pos-selector" class="opt-group" style="display:none; margin-top:15px; background:#f9f9f9; padding:10px; border-radius:12px;"></div>
        </div>
    </div>

    <div class="notice-board">
        <div class="notice-title">📢 系統公告</div>
        <div class="notice-content">
            Welcome To <b>連線數獨第一品牌</b>，<br>
            與朋友一同享受數獨的樂趣吧！<br>
            • 💡 <span onclick="openModal('guide-modal')" style="color: var(--purple); font-weight: bold; text-decoration: underline; cursor: pointer;">新手教學：點我查看玩法</span><br>
            • <b>換題投票</b>：如果覺得題目太🦐，可申請換題。<br>
            • <b>回報問題</b>：若發現題目有誤，請<b>回報❗</b>給我們。<br>
            • 使用電腦體驗更佳！<br>
            • 目前「簡單」和「自信」題庫共有50題！<br>
            • 出題、9x9模式等，敬請期待後續更新😎<br>
            <span style="font-size: 11px; color: #888;">上次更新：115/5/2</span>
            
            <div style="margin-top: 15px; padding: 10px; background: #f3f4f6; border-radius: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #e5e7eb;">
                <img src="sudokuQRcode.png" style="width: 55px; height: 55px; border-radius: 5px; background: white; padding: 2px;">
                <div style="text-align: left;">
                    <b style="font-size: 13px; color: #1f2937;">📲 快速邀請好友</b><br>
                    <span style="font-size: 11px; color: #4b5563;">手機掃碼立即開啟對戰</span>
                </div>
            </div>
        </div>
    </div>
</div> <div id="game-ui">
    <div class="game-left">
        <div id="board" class="grid"></div>
        <div style="margin-top:10px; font-size:12px; color:#bbb; display:flex; justify-content:space-between;">
            <div>題目：<span id="puzzle-id">--</span></div>
            <div id="report-link" style="cursor:pointer; text-decoration:underline; display:none;" onclick="openModal('report-modal')">回報問題</div>
        </div>
    </div>

    <div class="side-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="rid-txt" style="margin:0;">房號：----</h3>
            <span id="pnum-txt" style="background:#eee; padding:2px 8px; border-radius:5px; font-size:12px;">--號</span>
        </div>
        <div id="status-txt" class="status-banner">等待玩家...</div>
        <div class="member-area">
            <div style="font-size:11px; color:#999; margin-bottom:5px;">當前玩家</div>
            <div id="member-list-content"></div>
        </div>
        <button id="ready-btn" class="btn-main" style="background:var(--green); box-shadow:0 4px 0 #27ae60;" onclick="socket.emit('ready', myRoomId)">準備好了 👍</button>
        <button id="change-btn" class="btn-main" style="background:var(--gray); font-size:14px; box-shadow:0 4px 0 #7f8c8d;" onclick="socket.emit('requestChangePuzzle', myRoomId)">換題投票 (<span id="change-count">0/0</span>)</button>

        <div id="control-area" style="display:none;">
            <div class="keypad">
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(1)">1</button>
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(2)">2</button>
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(3)">3</button>
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(4)">4</button>
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(5)">5</button>
                <button class="n-btn" style="height:60px; font-size:24px;" onclick="fill(6)">6</button>
            </div>
        </div>
        <div style="margin-top:auto; text-align:center;">
            <button id="destroy-btn" class="btn-exit-trigger" style="color:var(--red); display:none;" onclick="openModal('destroy-modal')">解散房間</button>
            <button id="leave-btn" class="btn-exit-trigger" style="display:none;" onclick="if(confirm('確定要退出房間嗎？')) { socket.emit('leaveRoom', myRoomId); }">退出房間🏃‍♂️</button>
        </div>
    </div>
</div>
